<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Page</title>
</head>
<body>
    <h1>Student Profile</h1>

    <section>
        <h2>Profile</h2>
        <p>Name: <strong>Shyam Sundar</strong></p>
        <p>College: <strong>SKIT</strong></p>
        <p>Branch: <strong>Computer Science</strong></p>
        <p>Photo: <img src="photo 1.jpeg" alt="Student photo" width="200" ></p>
    </section>

    <section>
        <h2>Education</h2>
        <table border="1" cellpadding="10" cellspacing="0">
            <tr>
                <th>Year</th>
                <th>Institution</th>
                <th>Degree</th>
               
            </tr>
            <tr>
                <td>2026</td>
                <td>SKIT</td>
                <td>B.TECH Computer Science</td>
               
            </tr>
            <tr>
                <td>2022</td>
                <td>Children Academy</td>
                <td>Class 12</td>
              
            </tr>
        </table>
    </section>

    <section>
        <h2>Skills</h2>
        <ul>
            <li>HTML/CSS</li>
            <li>Basic JavaScript</li>
            <li>Problem Solving</li>
            <li>C/C++</li>
        </ul>
    </section>

    <section>
        <h2>Contact Form</h2>
        <form>
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div>
                <label for="message">Message:</label>
                <input type="text" id="message" name="message">
            </div>
            <div>
                <input type="submit" value="Submit">
            </div>
        </form>
    </section>
</body>
</html>
