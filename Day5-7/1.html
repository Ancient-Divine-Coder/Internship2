<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Data Cards</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-strong: rgba(255, 255, 255, 0.15);
      --text: #edf2ff;
      --accent: #6d8bff;
      --accent-soft: rgba(109, 139, 255, 0.18);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #2b5fdb 0%, transparent 35%),
        radial-gradient(circle at bottom right, #ffd97f 0%, transparent 28%),
        linear-gradient(180deg, #08111f 0%, #0e1b33 100%);
      color: var(--text);
      padding: 28px;
    }

    .page-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 28px;
    }

    header {
      padding: 32px 36px;
      background: var(--panel-strong);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: 0.02em;
      margin-bottom: 12px;
    }

    header p {
      max-width: 720px;
      line-height: 1.7;
      color: #d9e2ff;
    }

    .content-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(320px, 420px) 1fr;
    }

    .card-panel,
    .form-panel {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      backdrop-filter: blur(18px);
    }

    .form-panel h2,
    .card-panel h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #f8fbff;
    }

    .form-grid {
      display: grid;
      gap: 16px;
    }

    .form-grid label {
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
      color: #d6ddff;
    }

    .form-grid input,
    .form-grid select {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .form-grid input:focus,
    .form-grid select:focus {
      border-color: rgba(109, 139, 255, 0.9);
      transform: translateY(-1px);
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      background: linear-gradient(135deg, #6d8bff, #6ee7ff);
      color: #071125;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 18px 35px rgba(109, 139, 255, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 45px rgba(109, 139, 255, 0.34);
    }

    .card-list {
      display: grid;
      gap: 24px;
    }

    .student-card {
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(12, 18, 35, 0.96) 0%, rgba(22, 34, 60, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.23);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .student-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 34px 80px rgba(0, 0, 0, 0.28);
    }

    .student-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(109, 139, 255, 0.16), transparent 26%);
      pointer-events: none;
    }

    .student-summary {
      display: grid;
      gap: 14px;
      cursor: pointer;
    }

    .summary-label {
      font-size: 0.92rem;
      color: #96a3ff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .student-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: #f7f9ff;
      font-size: 1.15rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .student-id:hover {
      background: rgba(109, 139, 255, 0.22);
      transform: translateY(-1px);
    }

    .details-hint {
      color: #b0b8d8;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .card-details {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.35s ease;
    }

    .student-card.expanded .card-details {
      max-height: 700px;
      opacity: 1;
      margin-top: 24px;
    }

    .student-card.expanded .student-id {
      background: rgba(109, 139, 255, 0.24);
    }

    .student-card h3 {
      margin-bottom: 8px;
      font-size: 1.45rem;
    }

    .student-card p {
      line-height: 1.75;
      color: #c7d1ff;
    }

    .student-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .meta-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 16px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
    }

    .meta-item span {
      display: block;
      font-size: 0.85rem;
      color: #96a3ff;
      margin-bottom: 8px;
    }

    .meta-item strong {
      font-size: 1.05rem;
      color: #f7f9ff;
    }

    .empty-state {
      padding: 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      text-align: center;
      color: #b0b8d8;
    }

    @media (max-width: 930px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header>
      <h1>Student Data Dashboard</h1>
      <p>Capture student details in stylish cards, review profiles quickly, and add new records with a single click. Each student card includes name, age, year, CGPA, branch, and a creative UI layout.</p>
    </header>

    <div class="content-grid">
      <section class="form-panel">
        <h2>Add Student Details</h2>
        <div class="form-grid">
          <label>
            Student Name
            <input type="text" id="studentName" placeholder="Aanya Sharma" />
          </label>
          <label>
            Age
            <input type="number" id="studentAge" placeholder="20" min="15" max="40" />
          </label>
          <label>
            Branch
            <select id="studentBranch">
              <option value="Computer Science">Computer Science</option>
              <option value="Electronics">Electronics</option>
              <option value="Mechanical">Mechanical</option>
              <option value="Civil">Civil</option>
              <option value="Business Analytics">Business Analytics</option>
            </select>
          </label>
          <label>
            Year
            <select id="studentYear">
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </label>
          <label>
            CGPA
            <input type="number" id="studentCgpa" placeholder="8.7" step="0.01" min="0" max="10" />
          </label>
          <label>
            Email
            <input type="email" id="studentEmail" placeholder="aanya.sharma@example.com" />
          </label>
          <label>
            Enrollment ID
            <input type="text" id="studentId" placeholder="STU2026A01" />
          </label>
        </div>

        <div class="button-row">
          <button id="addStudentButton">Add Student</button>
          <button id="clearFormButton" type="button">Clear Form</button>
        </div>
      </section>

      <section class="card-panel">
        <h2>Student Cards</h2>
        <div class="card-list" id="cardList">
          <!-- Cards will be inserted here -->
        </div>
      </section>
    </div>
  </div>

  <script>
    const cardList = document.getElementById('cardList');
    const formFields = {
      name: document.getElementById('studentName'),
      age: document.getElementById('studentAge'),
      branch: document.getElementById('studentBranch'),
      year: document.getElementById('studentYear'),
      cgpa: document.getElementById('studentCgpa'),
      email: document.getElementById('studentEmail'),
      id: document.getElementById('studentId'),
    };

    const sampleStudents = [
      {
        name: 'Aanya Sharma',
        age: 20,
        year: '3rd Year',
        cgpa: 8.9,
        branch: 'Computer Science',
        email: 'aanya.sharma@example.com',
        id: 'CS2026A01',
      },
      {
        name: 'Rohan Verma',
        age: 21,
        year: '4th Year',
        cgpa: 9.2,
        branch: 'Electronics',
        email: 'rohan.verma@example.com',
        id: 'EC2025B11',
      },
    ];

    function closeAllCards() {
      document.querySelectorAll('.student-card.expanded').forEach((card) => card.classList.remove('expanded'));
    }

    function attachCardToggleHandlers() {
      document.querySelectorAll('.student-card').forEach((card) => {
        const idTrigger = card.querySelector('.student-id');
        if (!idTrigger) return;

        idTrigger.addEventListener('click', () => {
          const isOpen = card.classList.contains('expanded');
          closeAllCards();
          if (!isOpen) card.classList.add('expanded');
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      });
    }

    function renderCards(students) {
      if (!students.length) {
        cardList.innerHTML = '<div class="empty-state">No student cards yet. Add student details using the form on the left.</div>';
        return;
      }

      cardList.innerHTML = students
        .map((student) => {
          const initials = student.name
            .split(' ')
            .map((part) => part[0])
            .join('')
            .slice(0, 2)
            .toUpperCase();

          return `
            <article class="student-card" data-student-id="${student.id}">
              <div class="student-summary">
                <div>
                  <div class="summary-label">Student ID</div>
                  <div class="student-id">${student.id}</div>
                </div>
                <div class="details-hint">Tap the ID to reveal the full profile card.</div>
              </div>

              <div class="card-details">
                <div class="profile-badge">${initials}</div>
                <h3>${student.name}</h3>
                <p>Branch: <strong>${student.branch}</strong></p>
                <p>Year: <strong>${student.year}</strong></p>
                <p>Email: <strong>${student.email}</strong></p>
                <p>ID: <strong>${student.id}</strong></p>

                <div class="student-meta">
                  <div class="meta-item">
                    <span>Age</span>
                    <strong>${student.age}</strong>
                  </div>
                  <div class="meta-item">
                    <span>CGPA</span>
                    <strong>${student.cgpa}</strong>
                  </div>
                  <div class="meta-item">
                    <span>Status</span>
                    <strong>${student.cgpa >= 7 ? 'Good Standing' : 'Needs Improvement'}</strong>
                  </div>
                </div>
              </div>
            </article>
          `;
        })
        .join('');

      attachCardToggleHandlers();
    }


    function clearForm() {
      formFields.name.value = '';
      formFields.age.value = '';
      formFields.branch.value = 'Computer Science';
      formFields.year.value = '1st Year';
      formFields.cgpa.value = '';
      formFields.email.value = '';
      formFields.id.value = '';
    }

    function addStudent() {
      const student = {
        name: formFields.name.value.trim(),
        age: formFields.age.value.trim(),
        branch: formFields.branch.value,
        year: formFields.year.value,
        cgpa: formFields.cgpa.value.trim(),
        email: formFields.email.value.trim(),
        id: formFields.id.value.trim(),
      };

      if (!student.name || !student.age || !student.cgpa || !student.id || !student.email) {
        alert('Please fill in name, age, CGPA, email, and enrollment ID before adding a student.');
        return;
      }

      if (Number(student.cgpa) < 0 || Number(student.cgpa) > 10) {
        alert('CGPA must be between 0 and 10.');
        return;
      }

      sampleStudents.unshift({
        ...student,
        age: Number(student.age),
        cgpa: Number(student.cgpa).toFixed(2),
      });
      renderCards(sampleStudents);
      clearForm();
    }

    document.getElementById('addStudentButton').addEventListener('click', addStudent);
    document.getElementById('clearFormButton').addEventListener('click', clearForm);

    renderCards(sampleStudents);
  </script>
</body>
</html>
